<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>try{var m=localStorage.getItem("tumbuh-theme");if(m==="dark"||(!m&&matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <main id="main" class="container page">

    <!-- HERO: welcome text + today's index -->
    <section class="hero">
      <div class="hero__text">
        <span class="eyebrow eyebrow--chip" data-i18n="heroEyebrow"></span>
        <h1 data-i18n="heroTitle" data-i18n-html></h1>
        <p class="hero__sub" data-i18n="heroSub"></p>
        <div class="hero__ctas">
          <a class="btn btn--primary btn--lg" href="belajar.html"><span data-i18n="startFree"></span><span id="hero-arrow"></span></a>
          <a class="btn btn--ghost btn--lg" href="ringkasan.html" data-i18n="heroCta2"></a>
        </div>
      </div>

      <div class="card index-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div>
            <div style="font-weight:700" data-i18n="ihsgLabel"></div>
            <div style="font-size:13px;color:var(--muted-2)" data-i18n="ihsgName"></div>
          </div>
          <a class="link-arrow" href="kamus.html#ihsg" style="font-size:14px" data-i18n="whatIsThis"></a>
        </div>
        <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px">
          <span class="index-card__value num" id="ihsg-value"></span>
          <span id="ihsg-pill"></span>
        </div>
        <div class="chart chart--sm" id="ihsg-chart"></div>
        <div class="chart__axis" style="margin-top:-6px"><span data-i18n="last3m"></span><span data-i18n="now"></span></div>
        <div class="explain"><span id="ihsg-icon"></span><p id="ihsg-explain"></p></div>
      </div>
    </section>

    <!-- START HERE: learning path -->
    <section class="stack" style="gap:22px">
      <div class="section-head">
        <div class="stack" style="gap:6px">
          <h2 data-i18n="startTitle"></h2>
          <p class="lead" id="start-sub"></p>
        </div>
        <div style="display:flex;align-items:center;gap:12px;min-width:220px">
          <div class="progress" style="flex:1"><span id="path-bar"></span></div>
          <span style="font-size:14px;font-weight:700;color:var(--text-2)" id="path-text"></span>
        </div>
      </div>
      <div class="grid-auto" id="path"></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px 24px">
        <a class="link-arrow" href="belajar.html" id="all-lessons" style="padding:4px 0"></a>
        <a class="link-arrow" href="prestasi.html" style="padding:4px 0" data-i18n="achTitle"></a>
      </div>
    </section>

    <!-- MARKET MAP: every LQ45 stock as a tile -->
    <section class="card stack" style="gap:16px" aria-labelledby="hm-title" id="peta">
      <div class="section-head" style="align-items:center">
        <div class="stack" style="gap:6px">
          <h2 id="hm-title" style="font-size:24px;font-weight:800" data-i18n="hmTitle"></h2>
          <p class="lead" style="font-size:15px" data-i18n="hmSub"></p>
        </div>
        <div class="segmented" role="group" id="hm-period" data-i18n-attr="aria-label:hmTitle">
          <button type="button" data-p="1D" aria-pressed="true" data-i18n="hm1D"></button>
          <button type="button" data-p="1M" aria-pressed="false" data-i18n="hm1M"></button>
          <button type="button" data-p="1Y" aria-pressed="false" data-i18n="hm1Y"></button>
        </div>
      </div>
      <div class="heatmap" id="heatmap"></div>
      <div class="hm-legend">
        <span id="hm-lo" class="num"></span><span class="hm-legend__bar" aria-hidden="true"></span><span id="hm-hi" class="num"></span>
        <span class="hm-legend__note" data-i18n="hmNote"></span>
      </div>
    </section>

    <!-- MARKET: movers, sectors, term of the day -->
    <section id="pasar" class="split" style="scroll-margin-top:90px">
      <div class="card split__main" style="padding-bottom:12px;gap:16px">
        <div class="stack" style="gap:6px">
          <h2 style="font-size:24px;font-weight:800" data-i18n="moversTitle"></h2>
          <p class="lead" style="font-size:15px" data-i18n="moversSub"></p>
        </div>
        <div class="chips" role="tablist" id="mover-tabs" data-i18n-attr="aria-label:moversTitle">
          <button class="chip" role="tab" data-tab="up" data-i18n="tabUp"></button>
          <button class="chip" role="tab" data-tab="down" data-i18n="tabDown"></button>
          <button class="chip" role="tab" data-tab="active" data-i18n="tabActive"></button>
        </div>
        <div class="stock-table">
          <div class="stock-table__head"><span data-i18n="colStock"></span><span class="col-r"><span data-i18n="colPrice"></span><span data-i18n="colChange"></span></span></div>
          <div id="movers"></div>
        </div>
        <a class="link-arrow" href="penyaring.html" style="align-self:flex-start;padding:8px 12px" data-i18n="seeAll"></a>
      </div>

      <div class="split__side">
        <div class="card stack" style="gap:14px">
          <div class="stack" style="gap:4px">
            <h2 style="font-size:20px;font-weight:800" data-i18n="sectorsTitle"></h2>
            <p style="font-size:14px;color:var(--muted)" data-i18n="sectorsSub"></p>
          </div>
          <div class="stack" style="gap:12px" id="sectors"></div>
        </div>

        <div class="card card--dark stack" style="gap:14px" id="term-card"></div>
      </div>
    </section>

    <!-- SCREENER PRESETS -->
    <section class="stack" style="gap:22px">
      <div class="stack" style="gap:6px">
        <h2 style="font-size:clamp(24px,3vw,32px);font-weight:800" data-i18n="screenTitle"></h2>
        <p class="lead" data-i18n="screenSub"></p>
      </div>
      <div class="grid-auto" id="presets"></div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/companies.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/market-data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/pages/home.js"></script>
</body>
</html>
